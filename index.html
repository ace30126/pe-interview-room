<!DOCTYPE html>
<html lang="ko">
<head>
<title>기술사 면접실</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* 레이아웃: 좌 사이드바(응시자 > 세션 디렉토리) | 이력카드 | 질문 카드 세로 목록(상단 총시간 고정, 하단 총평). 보고서는 모달 미리보기 */
:root{
  --paper:#F3F5F4; --sheet:#FFFFFF; --side:#EAEEEC;
  --ink:#1A2230; --muted:#5B6675; --rule:#D6DCE0;
  --accent:#2C4FA3; --accent-soft:#E4EAF7;
  --ok:#2E7D4F; --warn:#B7791F; --over:#C0392B;
  --ok-soft:#E3F1E8; --warn-soft:#FBF0DC; --over-soft:#F8E1DE;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#13171D; --sheet:#1B2129; --side:#171C23; --ink:#E4E8EE; --muted:#97A2B0; --rule:#2F3743;
    --accent:#8FA9EC; --accent-soft:#232E46;
    --ok:#6CC08F; --warn:#E3B05C; --over:#F0877B;
    --ok-soft:#1C2E24; --warn-soft:#352A17; --over-soft:#3A1F1C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#13171D; --sheet:#1B2129; --side:#171C23; --ink:#E4E8EE; --muted:#97A2B0; --rule:#2F3743;
  --accent:#8FA9EC; --accent-soft:#232E46;
  --ok:#6CC08F; --warn:#E3B05C; --over:#F0877B;
  --ok-soft:#1C2E24; --warn-soft:#352A17; --over-soft:#3A1F1C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:6px 12px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:3px 9px;font-size:12px}
select,input[type=text],input[type=search]{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px}
.sample{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:500;white-space:nowrap}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag{font-size:11px;padding:1px 7px;border-radius:3px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.gichul{border-color:var(--accent);color:var(--accent)}
.tag.preset{border-color:var(--ok);color:var(--ok)}
.kinds{grid-column:2/-1;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.kinds button{font-size:12px;padding:1px 9px;border:1px solid var(--rule);border-radius:99px;background:var(--sheet);color:var(--muted)}
.kinds button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--sheet)}

/* 전체 틀 */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--rule);padding:14px 10px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:0 6px}
.brand h1{font-size:16px;font-weight:700}
.main{padding:0 16px 32px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule)}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:500}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.menuBtn{display:none}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:15;transform:translateX(-100%);transition:transform .2s}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgb(0 0 0 / .3)}
  .menuBtn{display:inline-block}
}

/* 사이드바 디렉토리 */
.tree{display:flex;flex-direction:column;gap:2px;font-size:13px}
.tree details>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"▸";font-size:10px;color:var(--muted);width:10px;transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover,.tree .leaf:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tree summary .sub{margin-left:auto;font-size:11px;color:var(--muted)}
.tree .leaf{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:4px 6px 4px 28px;border-radius:4px;font-size:13px}
.tree .leaf[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok)}
.tree .add{color:var(--muted);padding-left:28px}
.tree details.grp>summary{font-weight:600;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.tree details.grp>.gin{padding-left:10px}
.tree .leaf{white-space:nowrap}
.tree .leaf .who{margin-left:auto;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.tree .leaf.past{color:var(--muted)}
.tree .leaf .ro{font-size:10.5px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 3px}
.robar{margin:0 0 10px;padding:7px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.room.ro #addBtn,.room.ro #gichulBtn,.room.ro .tags input,.room.ro .tags .chip button,.room.ro .ctrl button{display:none}
.room.ro .grip{visibility:hidden}
.ivs .chip.plan{background:none;border:1px dashed var(--rule);color:var(--muted)}
.timeIn{width:7.5em}
#verInfo{font-size:11.5px;color:var(--muted)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}

/* 면접 화면 */
.room{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start;padding-top:16px}
@media (max-width:820px){.room{grid-template-columns:1fr}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.cardpane{padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media (max-width:820px){.cardpane{position:static}}
.cardpane header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.photo{position:relative;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper);cursor:zoom-in}
.photo img{display:block;width:100%;height:auto}
.photo.empty{display:grid;place-items:center;min-height:240px;border-style:dashed;cursor:pointer;color:var(--muted);text-align:center;padding:16px}
.photo-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cardpane.dropping .photo{outline:2px dashed var(--accent);outline-offset:3px}
.pending{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:4px;background:var(--warn-soft);color:var(--warn);font-size:12px}
.pending .sp{flex:1}
.summary{display:flex;flex-direction:column;gap:4px}
.summary textarea{width:100%;border:1px solid transparent;background:var(--paper);border-radius:4px;padding:6px 8px;resize:none;overflow:hidden;line-height:1.55;min-height:60px}
.summary textarea:focus{border-color:var(--rule);background:var(--sheet)}

/* 예시 이력카드 (사진 첨부 전 자리) */
.rcard{border:1px solid #1A2230;background:#fff;color:#1A2230;font-size:12.5px}
.rcard .rc-title{text-align:center;font-weight:700;letter-spacing:.4em;padding:8px;border-bottom:1px solid #1A2230}
.rcard table{width:100%;border-collapse:collapse}
.rcard th,.rcard td{border-bottom:1px solid #D6DCE0;border-right:1px solid #D6DCE0;padding:5px 8px;text-align:left;vertical-align:top}
.rcard th{width:22%;font-weight:500;color:#5B6675;background:#F3F5F4}
.rcard tr:last-child th,.rcard tr:last-child td{border-bottom:0}
.rcard td:last-child{border-right:0}

/* 질문 카드 영역 */
.qpane{display:flex;flex-direction:column;gap:8px}
.qhead{position:sticky;top:0;z-index:4;background:var(--paper);padding-block:4px 8px;display:flex;flex-direction:column;gap:8px}
.totalbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px}
.totalbar .t{display:flex;align-items:baseline;gap:10px}
.totalbar .t .num{font-size:28px;font-weight:600;line-height:1}
.totalbar .meta{font-size:12px;color:var(--muted)}
.totalbar .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

.qcard{padding:8px 10px 8px 4px;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 8px;border-left:3px solid transparent}
.qcard.running{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 55%,var(--sheet))}
.qcard.dragging{opacity:.45}
.grip{grid-row:1/span 4;align-self:stretch;display:grid;place-items:start center;padding-top:3px;color:var(--muted);cursor:grab;user-select:none;font-size:13px;letter-spacing:-2px}
.grip:active{cursor:grabbing}
.qcard .q{font-weight:500;line-height:1.45;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.qcard .q span.text{flex:1 1 20ch}
.qcard .ctrl{display:flex;align-items:center;gap:4px;align-self:start}
.qcard .time{font-size:15px;font-weight:600;min-width:46px;text-align:right}
.ib{width:28px;height:28px;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;display:grid;place-items:center;padding:0}
.ib svg{width:13px;height:13px;fill:currentColor}
.ib.play{color:var(--ok)}
.ib.del{border-color:transparent;background:none;color:var(--muted)}
.qcard textarea{grid-column:2/-1;width:100%;border:1px solid transparent;background:var(--paper);border-radius:4px;padding:5px 8px;resize:none;overflow:hidden;min-height:32px;line-height:1.5;font-size:13px}
.qcard textarea:focus{border-color:var(--rule);background:var(--sheet)}
.qcard details{grid-column:2/-1;font-size:13px}
.qcard details summary{color:var(--accent);cursor:pointer;width:max-content;font-size:12px}
.qcard details p{margin:6px 0 2px;padding:8px 10px;background:var(--accent-soft);border-radius:4px;white-space:pre-wrap}
.qcard .q span.text[data-act]{cursor:text}
.qedit{border:0;background:transparent;font-weight:500;padding:0;flex:1 1 20ch}
.overall{padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.overall textarea{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:8px;resize:none;overflow:hidden;min-height:80px}

/* 모달 */
dialog{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:0;width:min(880px,calc(100% - 32px));max-height:calc(100% - 48px)}
dialog::backdrop{background:rgb(10 14 20 / .45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.dlg header h2{font-size:16px}
.dlg header .x{margin-left:auto}
.dlg .filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--rule)}
.dlg .filters input{flex:1 1 220px}
.dlg .body{overflow-y:auto;padding:4px 16px 16px}
.gq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.gq .q{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.gq details{grid-column:1/-1;font-size:13px}
.gq details summary{color:var(--muted);cursor:pointer;font-size:12px;width:max-content}
.gq details p{margin:6px 0 0;padding:8px 10px;background:var(--paper);border-radius:4px;white-space:pre-wrap}
.empty-msg{padding:24px 0;color:var(--muted);text-align:center}

/* 보고서: A4 가로 */
dialog.report{width:min(1060px,calc(100% - 32px))}
.pages{display:flex;flex-direction:column;gap:18px;padding:16px;background:var(--paper)}
.page-wrap{overflow-x:auto}
.page{width:100%;min-width:680px;aspect-ratio:297/210;background:#fff;color:#1A2230;border:1px solid #D6DCE0;box-shadow:0 2px 10px rgb(0 0 0 / .08);padding:3% 3.4%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);overflow:hidden;gap:3%;font-size:10.5px;position:relative}
.page::after{content:"";position:absolute;left:50%;top:3%;bottom:3%;border-left:1px solid #9AA4B0}
.page .col{display:flex;flex-direction:column;gap:7px;min-height:0;overflow:hidden}
.page .fbi{border-bottom:1px solid #D6DCE0;padding-bottom:6px;display:flex;flex-direction:column;gap:3px}
.page .fbi .h{display:flex;gap:8px;justify-content:space-between;font-weight:500}
.page .fbi .h .num{font-weight:600;white-space:nowrap}
.page .fbi .src{color:#2C4FA3}
.page .fbi .n{white-space:pre-wrap;line-height:1.55}
.page h3{font-size:13px}
.page .pg{position:absolute;bottom:1.5%;right:3.4%;font-size:9px;color:#5B6675}
.page .meta{color:#5B6675}
.page .kpi{display:flex;gap:10px}
.page .kpi div{border:1px solid #D6DCE0;padding:6px 10px;flex:1}
.page .kpi b{display:block;font-family:var(--font-num);font-size:16px}
.page .box{border:1px solid #D6DCE0;padding:8px;white-space:pre-wrap;line-height:1.6}
.page .imgcap{border:1px solid #D6DCE0}
.page .imgcap img{display:block;width:100%;height:auto}
.page .rcard{font-size:10px}
.page table.fb{width:100%;border-collapse:collapse}
.page table.fb th,.page table.fb td{border:1px solid #D6DCE0;padding:4px 6px;text-align:left;vertical-align:top}
.page table.fb th{background:#F3F5F4;font-weight:500}
.page .over{color:#C0392B}
.zoombox{position:fixed;inset:0;background:rgb(10 14 20 / .6);display:grid;place-items:center;padding:24px;z-index:20;cursor:zoom-out}
.zoombox>*{max-width:min(760px,100%);max-height:100%;overflow:auto}
.zoombox .rcard{font-size:15px}
.busy{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:50;overflow:hidden;pointer-events:none}
.busy::before{content:"";position:absolute;inset:0 auto 0 0;width:30%;background:var(--accent);animation:busy 1.1s ease-in-out infinite}
@keyframes busy{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.busy::before{animation:none;width:100%;opacity:.6}}
.dateIn{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink)}
.inv{display:flex;flex-wrap:wrap;gap:4px 10px;max-height:160px;overflow-y:auto;font-size:13px}
.inv .chip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 4px}
.invBox{display:flex;flex-direction:column;gap:6px}
.tree .locked{font-size:12px;color:var(--muted);padding:4px 8px 6px 22px}
.leaf .soon{margin-left:6px;font-size:11px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:var(--r);font-size:13px;z-index:40}
@media (prefers-reduced-motion:reduce){.side,.tree details>summary::before{transition:none}}
</style>
</head>
<body>
<style>
/* 실제 앱 추가 스타일 */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:50;padding:16px}
.gate .box{max-width:420px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate h2{font-size:20px}
.gate a.btn{text-decoration:none;display:inline-block}
.save{font-size:12px;color:var(--muted)}
.save.err{color:var(--over)}
.ivs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ivs .chip button{border:0;background:none;color:inherit;padding:0 0 0 4px;cursor:pointer}
.ivs .ivbtn{padding:2px 9px;font-size:12px;border-radius:99px;border-style:dashed}
dialog.small{width:min(460px,calc(100% - 32px))}
.ivlist{max-height:min(52vh,420px);overflow-y:auto;padding:4px 8px 8px}
.ivrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border:0;border-bottom:1px solid var(--rule);background:none;color:inherit;text-align:left;cursor:pointer;border-radius:4px}
.ivrow:hover,.ivrow:focus-visible{background:var(--paper)}
.ivrow .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;flex:none}
.ivrow .who{flex:1;min-width:0}
.ivrow .who small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ivrow .st{font-size:12px;color:var(--muted);flex:none}
.ivrow[aria-pressed="true"] .st{color:var(--ok);font-weight:600}
.meet{display:flex;gap:4px}
.meet input{width:200px;padding:4px 8px;font-size:12px}
.blank{padding:48px 16px;text-align:center;color:var(--muted)}
.others{grid-column:2/-1;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.others b{color:var(--ink);font-weight:500}
.tags{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tags .chip button{border:0;background:none;color:inherit;padding:0 0 0 3px;cursor:pointer}
.tags input{border:1px dashed var(--rule);background:transparent;border-radius:99px;padding:1px 9px;font-size:12px;width:9em}
.tags input:focus{border-style:solid;background:var(--sheet)}
.invRow{display:flex;gap:6px;flex-wrap:wrap}
.invRow #cInvName{flex:0 1 8em}
.invRow #cInvIn{flex:1 1 14em}
.fu{grid-column:2/-1;font-size:12px;color:var(--muted);margin:0;padding-left:16px}
.form2{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:16px}
.form2 label{color:var(--muted);font-size:13px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--rule)}
.freq{font-size:11px;color:var(--warn);white-space:nowrap}
.review{font-size:11px;color:var(--over)}
/* 관리자 페이지 */
.btn:disabled{opacity:.45;cursor:not-allowed}
.admin{padding-top:12px;display:flex;flex-direction:column;gap:14px}
.atabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.atabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.atabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
#adminBody{display:flex;flex-direction:column;gap:14px}
.asec{padding:14px;display:flex;flex-direction:column;gap:10px}
.asec h3{font-size:14px}
.asec .hint{margin:0;font-size:12px;color:var(--muted)}
.arow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.arow .push{margin-left:auto}
.tblw{overflow-x:auto}
table.at{width:100%;border-collapse:collapse;font-size:13px}
table.at th,table.at td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:middle}
table.at th{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
table.at input[type=text]{padding:3px 7px;width:100%;min-width:7em}

<script>
const SB_URL = "https://gqvwejjfhpziruqvrtxo.supabase.co";
const SB_KEY = "sb_publishable_CQAJgMjRRxUAqtQDK0F21g_7duxKLom"; // 공개 키. 권한은 DB의 RLS가 막는다
const sb = supabase.createClient(SB_URL, SB_KEY);
const BUCKET = "pe-files";
let ME = "";
const store = { get(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

const INTRO = {career:"경력을 중심으로 자기소개를 해 주세요.", project:"가장 성공적이었던 프로젝트를 중심으로 자기소개를 해 주세요.", pros:"본인의 장단점을 중심으로 자기소개를 해 주세요."};
const INTRO_LABEL = {career:"경력기반", project:"성공프로젝트", pros:"장단점", etc:"기타"};
const VISION_Q = "기술사 취득 후 포부를 말씀해 주세요.";
const ICON = {
  play:'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>',
  pause:'<svg viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>',
  reset:'<svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.4.5A4 4 0 1 0 8 4v2L4.5 3.25 8 .5z"/></svg>',
  edit:'<svg viewBox="0 0 16 16"><path d="M11.3 1.9l2.8 2.8-8.4 8.4-3.4.6.6-3.4zM10.2 3l2.8 2.8" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>',
  del:'<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>',
};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const md = d => String(d).slice(5).replace("-","/");
const grow = ta => { ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; };
const rid = () => "k"+Math.random().toString(36).slice(2,12);
// 처리 중 버튼을 잠가 연타로 같은 요청이 여러 번 나가지 않게 한다
async function lockBtn(btn, fn){
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  try { return await fn(); } finally { btn.disabled = false; }
}
const toast = m => { const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); };

// 화면을 기다리게 하는 호출은 상단 로딩바를 띄운다. 자동 저장처럼 뒤에서 도는 호출은 quiet.
let pending = 0, busyTimer = null;
function busy(d){
  pending += d;
  if (pending > 0 && !busyTimer && $("#busy").hidden) busyTimer = setTimeout(() => { busyTimer = null; if (pending > 0) $("#busy").hidden = false; }, 150);
  if (pending <= 0) { pending = 0; clearTimeout(busyTimer); busyTimer = null; $("#busy").hidden = true; }
}
const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const blobToDataUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
const dataUrlToBlob = u => fetch(u).then(r => r.blob());
async function notesOf(cardIds){
  const map = {};
  if (!cardIds.length) return map;
  must(await sb.from("pe_notes").select("card_id,email,note").in("card_id", cardIds))
    .forEach(n => { (map[n.card_id] = map[n.card_id] || {})[n.email] = n.note; });
  return map;
}
// 화면 코드는 예전 Apps Script 응답 모양 그대로 쓴다. 여기서 Supabase 호출로 바꿔 준다.
const API = {
  async boot(){
    const [mem, cands, sess, dir] = (await Promise.all([
      sb.from("pe_members").select("email,name,role,active"),
      sb.from("pe_candidates").select("id,name,field,round,email,memo,img_path,created_by,invited,grp").order("created_at"),
      sb.from("pe_sessions").select("id,cand_id,date,time,interviewers,plan_iv"),
      sb.rpc("pe_cand_dir_g"),
    ])).map(must);
    const me = mem.find(m => m.email === ME && m.active);
    if (!me) throw new Error("NOT_MEMBER:" + ME);
    return {
      me: {email:ME, name:me.name || ME.split("@")[0], admin:me.role === "admin"},
      admins: mem.filter(m => m.active && m.role === "admin").map(m => m.email),
      members: mem.filter(m => m.active).map(m => ({email:m.email, name:m.name || m.email.split("@")[0]})),
      cands: cands.map(c => ({id:c.id, name:c.name, field:c.field, round:c.round, email:c.email, memo:c.memo, hasImg:!!c.img_path, imgPath:c.img_path, createdBy:c.created_by, invited:c.invited || [], grp:c.grp || ""})),
      dir: dir.map(d => ({id:d.id, name:d.name, field:d.field, round:d.round, createdBy:d.created_by, invited:d.invited || [], grp:d.grp || ""})),
      sessions: sess.map(s => ({id:s.id, candId:s.cand_id, date:s.date, time:s.time || "", interviewers:s.interviewers, planIv:s.plan_iv || ""})),
    };
  },
  async imageVers({id}){
    return must(await sb.from("pe_cand_images").select("id,path,since").eq("cand_id", id).order("since").order("id"));
  },
  async imageData({path}){
    return blobToDataUrl(must(await sb.storage.from(BUCKET).download(path)));
  },
  // 같은 날짜 기준본이 이미 있으면 바꿔 끼우고, 아니면 새 기준본을 추가한다 (예전 사진은 지난 세션용으로 남긴다)
  async setImage({id, dataUrl, since}){
    const path = `${id}/card_${Date.now()}.jpg`;
    must(await sb.storage.from(BUCKET).upload(path, await dataUrlToBlob(dataUrl), {contentType:"image/jpeg"}));
    const same = must(await sb.from("pe_cand_images").select("id,path").eq("cand_id", id).eq("since", since));
    must(await sb.from("pe_cand_images").insert({cand_id:id, path, since}));
    if (same.length) {
      must(await sb.from("pe_cand_images").delete().in("id", same.map(x => x.id)));
      await sb.storage.from(BUCKET).remove(same.map(x => x.path));
    }
    return API.syncLatest({id});
  },
  async clearImage({id, verId, path}){
    must(await sb.from("pe_cand_images").delete().eq("id", verId));
    await sb.storage.from(BUCKET).remove([path]);
    return API.syncLatest({id});
  },
  // pe_candidates.img_path는 가장 최신 기준본을 가리키게 둔다 (목록의 사진 유무 표시용)
  async syncLatest({id}){
    const vers = await API.imageVers({id});
    must(await sb.from("pe_candidates").update({img_path:vers.length ? vers[vers.length-1].path : ""}).eq("id", id));
    return vers;
  },
  async setTime({id, time}){
    must(await sb.from("pe_sessions").update({time}).eq("id", id));
    return true;
  },
  // 새 응시자는 화면에서 정한 id로 들어온다. 같은 id가 또 오면(재시도·연타) 새로 만들지 않는다.
  async saveCand({cand:x, withBoot}){
    if (x.name !== undefined && !x.name) throw new Error("응시자 이름을 입력하세요");
    // 응시자 본인 이메일도 앱 가입 초대에 넣는다. 안 넣으면 본인이 로그인해도 "초대받지 않았습니다"에서 막힌다.
    const inv = [...(x.invited || [])], invNm = {...(x.invNames || {})};
    const ce = String(x.email || "").trim().toLowerCase();
    if (ce && !inv.includes(ce)) { inv.push(ce); invNm[ce] = x.name || ""; }
    if (inv.length) must(await sb.rpc("pe_invite", {emails:inv, names:inv.map(e => invNm[e] || "")}));
    const isNew = !DB || !DB.cands.some(c => c.id === x.id);
    if (isNew) {
      must(await sb.from("pe_candidates").upsert({id:x.id, name:x.name, field:x.field || "", round:x.round || "",
        email:(x.email || "").trim().toLowerCase(), invited:x.invited || [], created_by:ME, grp:x.grp || ""}, {onConflict:"id", ignoreDuplicates:true}));
    } else {
      const patch = {};
      ["name","field","round","email","memo","invited","grp"].forEach(k => { if (k in x) patch[k] = k === "email" ? String(x[k]).trim().toLowerCase() : x[k]; });
      must(await sb.from("pe_candidates").update(patch).eq("id", x.id));
    }
    return withBoot ? {id:x.id, boot:await API.boot()} : x.id;
  },
  // 세션·카드·기록은 DB가 함께 지운다(on delete cascade). 사진 파일만 따로 지운다.
  async deleteCand({id}){
    const c = DB.cands.find(x => x.id === id);
    if (!c || !(DB.me.admin || c.createdBy === ME)) throw new Error("등록한 사람이나 관리자만 삭제할 수 있습니다");
    const files = must(await sb.storage.from(BUCKET).list(id));
    if (files.length) await sb.storage.from(BUCKET).remove(files.map(f => `${id}/${f.name}`));
    const gone = must(await sb.from("pe_candidates").delete().eq("id", id).select("id"));
    if (!gone.length) throw new Error("등록한 사람이나 관리자만 삭제할 수 있습니다");
    return {boot:await API.boot()};
  },
  async newSession({id, candId, date, cards}){
    must(await sb.from("pe_sessions").upsert({id, cand_id:candId, date, interviewers:[ME], created_by:ME}, {onConflict:"id", ignoreDuplicates:true}));
    const have = must(await sb.from("pe_cards").select("id").eq("session_id", id));
    if (!have.length) must(await sb.rpc("pe_save_session", {p:{id, cards}}));
    return {id, boot:await API.boot()};
  },
  async session({id}){
    const [s, cards] = (await Promise.all([
      sb.from("pe_sessions").select("*").eq("id", id).single(),
      sb.from("pe_cards").select("*").eq("session_id", id).order("ord"),
    ])).map(must);
    const notes = await notesOf(cards.map(c => c.id));
    return {
      session: {id:s.id, candId:s.cand_id, date:s.date, time:s.time || "", planIv:s.plan_iv || "", interviewers:s.interviewers, meet:s.meet, overall:s.overall, createdBy:s.created_by, startedAt:s.started_at || "", endedAt:s.ended_at || ""},
      cards: cards.map(c => ({id:c.id, q:c.q, preset:c.preset, kind:c.kind, src:c.src, followups:c.followups || [], ans:c.ans, t:c.t, tags:c.tags || [], notes:notes[c.id] || {}})),
    };
  },
  async saveSession(p){
    must(await sb.rpc("pe_save_session", {p}));
    const notes = await notesOf((p.cards || []).map(c => c.id));
    return {cards:(p.cards || []).map(c => ({id:c.id, notes:notes[c.id] || {}}))};
  },
  async deleteSession({id}){
    if (id) must(await sb.from("pe_sessions").delete().eq("id", id));
    return {boot:await API.boot()};
  },
  async gichul(){
    return must(await sb.from("pe_gichul").select("*").order("freq", {ascending:false}).order("id")).map(g => ({
      id:g.id, round:g.round, type:g.type, domain:g.domain, q:g.q, followups:g.followups || [], answer:g.answer, freq:g.freq || 0, needsReview:g.needs_review,
    }));
  },
};
async function call(action, payload, opt){
  const loud = !(opt && opt.quiet);
  if (loud) busy(1);
  try { return await API[action](payload || {}); }
  catch(e){
    const m = String(e && e.message || e);
    if (m.startsWith("NOT_MEMBER:")) gate(`${m.slice(11)} 계정은 아직 초대받지 않았습니다. 이 앱을 쓰는 사람에게 이 이메일로 초대를 요청하세요.`, true);
    else if (/JWT|not authenticated/i.test(m)) gate("로그인이 만료되었습니다. 다시 로그인하세요.");
    throw new Error(m);
  } finally { if (loud) busy(-1); }
}

const sKey = s => String(s.date) + (s.time || "");
const sWhen = s => md(s.date) + (s.time ? " " + s.time : "");

function canWrite(s){

function renderTree(){
  const mine = new Set(DB.cands.map(c => c.id));
  const isOpen = (k, def) => TREE_OPEN[k] === undefined ? def : TREE_OPEN[k];
  const leaf = (s, who) => `<button class="leaf ${String(s.date) < today() ? "past" : ""}" data-s="${s.id}" ${s.id===cur?'aria-current="true"':""}><span class="dot"></span>${sWhen(s)}${canWrite(s) ? "" : `<span class="ro">열람</span>`}<span class="who">${esc(who)}</span></button>`;
  // 내가 면접위원인 세션: 날짜순
  const myS = DB.sessions.filter(s => s.interviewers.includes(DB.me.email)).sort((a,b) => sKey(a).localeCompare(sKey(b)));
  const left = myS.filter(s => String(s.date) >= today()).length;
  const candName = id => (DB.cands.find(c => c.id === id) || {}).name || "";
  const mineHtml = myS.length ? `<details class="grp" data-k="mine" ${isOpen("mine", true) ? "open" : ""}><summary>내 면접 일정<span class="sub">${left}건 남음</span></summary><div class="gin">${myS.map(s => leaf(s, candName(s.candId))).join("")}</div></details>` : "";
  // 동명이인은 이메일 앞부분이나 등록자를 덧붙인다
  const dupe = n => DB.cands.filter(c => c.name === n).length + DB.dir.filter(d => d.name === n && !mine.has(d.id)).length > 1;
  const candHtml = c => {
    const ss = DB.sessions.filter(s => s.candId === c.id).sort((a,b) => sKey(a).localeCompare(sKey(b)));
    const k = "c:" + c.id, extra = dupe(c.name) ? (c.email ? c.email.split("@")[0] : nameOf(c.createdBy) + " 등록") : "";
    return `<details data-k="${k}" ${isOpen(k, ss.some(s => s.id === cur)) ? "open" : ""}><summary>${esc(c.name)}${extra ? ` <small class="muted">${esc(extra)}</small>` : ""}<span class="sub">${ss.length}회</span></summary>
      ${ss.map(s => leaf(s, ivNames(s))).join("")}
      <button class="leaf add" data-new="${c.id}">+ 새 세션</button>
      <button class="leaf add" data-edit="${c.id}">정보 수정·삭제</button></details>`;
  };
  const lockedHtml = d => `<details><summary>${esc(d.name)}<span class="sub">초대 필요</span></summary>
      <div class="locked">${esc(String(d.field).replace("기술사",""))}${d.round?` · ${esc(d.round)}회`:""}<br>열람하시려면 관리자나 이 응시자의 면접위원에게 초대를 요청하세요</div></details>`;
  const locked = DB.dir.filter(d => !mine.has(d.id));
  const groups = [...new Set([...DB.cands, ...locked].map(x => x.grp || ""))].sort((a,b) => (a === "") - (b === "") || a.localeCompare(b, "ko"));
  $("#tree").innerHTML = mineHtml + groups.map(g => {
    const k = "g:" + g;
    const cs = DB.cands.filter(c => (c.grp || "") === g), ls = locked.filter(d => (d.grp || "") === g);
    return `<details class="grp" data-k="${esc(k)}" ${isOpen(k, true) ? "open" : ""}><summary>${esc(g || "미분류")}<span class="sub">${cs.length + ls.length}명</span></summary>
      <div class="gin">${cs.map(candHtml).join("")}${ls.map(lockedHtml).join("")}</div></details>`;
  }).join("") + `<button class="leaf add" style="padding-left:6px" id="newCand">+ 응시자 추가</button>`;
}

// 큰 사진은 긴 변 1600px JPEG로 줄여서 보낸다 (Apps Script 호출 크기 제한 대비)
function shrink(dataUrl){
  return new Promise(res => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.width, im.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL("image/jpeg", .88));
  }; im.src = dataUrl; });
}

let editingCand = null, newCandId = null, invList = [], invNames = {};
// 초대: 이메일만 넣으면 된다. 저장할 때 그 사람이 자동으로 가입된다.
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function renderInv(){
  $("#cInv").innerHTML = invList.map(e => `<span class="chip">${esc(invNames[e] ? invNames[e] + " · " + e : DB.members.some(m => m.email === e) ? nameOf(e) + " · " + e : e)}<button type="button" data-unv="${esc(e)}" aria-label="${esc(e)} 초대 취소">×</button></span>`).join("")
    || `<span class="muted" style="font-size:12px">아직 초대한 사람이 없습니다</span>`;
}
// 처음 초대하는 사람(아직 가입 안 한 주소)은 이름이 있어야 넣는다. 이미 가입한 사람은 이메일만으로 된다.
function takeInv(){
  const e = $("#cInvIn").value.trim().toLowerCase(), n = $("#cInvName").value.trim();
  if (!e) { if (n) { toast("이메일도 입력하세요"); $("#cInvIn").focus(); return false; } return true; }
  if (!EMAIL_RE.test(e)) { toast("이메일 형식이 아닙니다: " + e); $("#cInvIn").focus(); return false; }
  const known = DB.members.find(m => m.email === e && m.name && m.name !== e.split("@")[0]);
  if (!known && !n) { toast("처음 초대하는 분은 이름을 입력하세요"); $("#cInvName").focus(); return false; }
  if (e !== DB.me.email && !invList.includes(e)) invList.push(e);
  if (n) invNames[e] = n;
  $("#cInvIn").value = ""; $("#cInvName").value = "";
  renderInv(); $("#cInvName").focus();
  return true;
}
function openCandDlg(c){
  editingCand = c;
  newCandId = c ? null : "c"+rid();
  $("#cTitle").textContent = c ? "응시자 정보 수정" : "응시자 추가";
  $("#cName").value = c ? c.name : ""; $("#cField").value = c ? (c.field || "정보관리기술사") : "정보관리기술사";
  $("#cRound").value = c ? c.round : ""; $("#cEmail").value = c ? (c.email || "") : "";
  const grps = [...new Set([...DB.cands, ...DB.dir].map(x => x.grp).filter(Boolean))].sort((a,b) => a.localeCompare(b, "ko"));
  $("#grpList").innerHTML = grps.map(g => `<option value="${esc(g)}">`).join("");
  $("#cGrp").value = c ? (c.grp || "") : ((cand() && cand().grp) || (grps.length === 1 ? grps[0] : ""));
  invList = c ? [...c.invited] : []; invNames = {}; $("#cInvIn").value = ""; $("#cInvName").value = ""; renderInv();
  $("#cDel").hidden = !c || !(DB.me.admin || c.createdBy === DB.me.email);
  $("#cDel").textContent = "응시자 삭제"; cDelArmed = false;
  $("#cDlg").showModal();
}
$("#editCand").onclick = () => openCandDlg(cand());
["cInvIn","cInvName"].forEach(id => $("#"+id).addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); takeInv(); } }));
$("#cInv").addEventListener("click", e => { const b = e.target.closest("[data-unv]"); if (b) { invList = invList.filter(x => x !== b.dataset.unv); renderInv(); } });
let cDelArmed = false;
$("#cDel").onclick = () => {
  const c = editingCand; if (!c) return;
  const n = DB.sessions.filter(s => s.candId === c.id).length;
  if (!cDelArmed) { cDelArmed = true; $("#cDel").textContent = `세션 ${n}개·기록까지 지워집니다. 한 번 더 누르면 삭제`; return; }
  lockBtn($("#cDel"), async () => {
    try {
      const r = await call("deleteCand", {id:c.id});
      if (S && S.session.candId === c.id) { cur = null; S = null; store.del("pe_last");
        $("#room").hidden = true; $("#sessTools").hidden = true; $("#blank").hidden = false; $("#crumb").textContent = "세션을 고르세요"; }
      DB = r.boot; renderTree(); $("#cDlg").close(); toast(`${c.name} 응시자를 삭제했습니다`);
    } catch(e){ toast("삭제하지 못했습니다: " + e.message); }
  });
};
$("#cForm").onsubmit = e => {
  e.preventDefault();
  const x = {name:$("#cName").value.trim(), field:$("#cField").value, round:$("#cRound").value.trim(), email:$("#cEmail").value.trim(), grp:$("#cGrp").value.trim()};
  x.id = editingCand ? editingCand.id : newCandId;
  if (!takeInv()) return;
  x.invited = [...invList]; x.invNames = {...invNames};
  lockBtn($("#cForm [type=submit]"), async () => {
    try {
      const r = await call("saveCand", {cand:x, withBoot:true}); $("#cDlg").close();
      DB = r.boot; renderTree(); if (S) renderCand();
      toast(editingCand ? "응시자 정보를 저장했습니다" : "응시자를 추가했습니다. 이름 아래 + 새 세션으로 면접을 시작하세요.");
    } catch(err){ toast("저장하지 못했습니다: "+err.message); }
  });
};

/* ---------- 세션 상단: 면접위원·Meet ---------- */
function renderSessionBar(){
  const s = S.session;
  const others = DB.members.filter(m => !s.interviewers.includes(m.email));
  $("#ivs").innerHTML = `<span class="label">면접위원</span>` +
    (s.planIv ? `<span class="chip plan" title="아직 가입 전이라 배정만 표시합니다">${esc(s.planIv)} · 미가입</span>` : "") +
    [...new Set(s.interviewers.map(nameOf))].map(n => { const es = s.interviewers.filter(e => nameOf(e) === n);
      return `<span class="chip">${esc(n)}${!S.ro && !es.includes(DB.me.email)?`<button data-rm="${esc(es.join(","))}" aria-label="${esc(n)} 빼기">×</button>`:""}</span>`; }).join("") +
    (others.length && !S.ro ? `<button class="btn ivbtn" id="ivAdd">+ 초대</button>` : "");
  $("#meetIn").value = s.meet || "";
  $("#dateIn").value = s.date || "";
  $("#timeIn").value = s.time || "";
}
$("#timeIn").onchange = async e => {
  const v = e.target.value; S.session.time = v;
  const row = DB.sessions.find(x => x.id === S.session.id); if (row) row.time = v;
  renderCand(); renderTree();
  try { await call("setTime", {id:S.session.id, time:v}, {quiet:true}); } catch(err){ toast("시각을 저장하지 못했습니다: " + err.message); }
};
$("#dateIn").onchange = e => {
  const v = e.target.value; if (!v) return;
  S.session.date = v; dirty = true;
  const row = DB.sessions.find(x => x.id === S.session.id); if (row) row.date = v;
  renderCand(); renderTree();
};
$("#ivs").addEventListener("click", e => {
  if (e.target.closest("#ivAdd")) { $("#iSearch").value = ""; renderIv(); $("#iDlg").showModal(); $("#iSearch").focus(); return; }
  const b = e.target.closest("[data-rm]"); if (!b) return; const rm = b.dataset.rm.split(","); S.session.interviewers = S.session.interviewers.filter(x => !rm.includes(x)); dirty = true; renderSessionBar(); renderCards();
});
// 면접위원 초대 모달: 검색 + 눌러서 넣고 빼기 (나는 항상 포함)
function renderIv(){
  const kw = $("#iSearch").value.trim().toLowerCase(), on = S.session.interviewers;
  const list = DB.members.filter(m => m.email !== DB.me.email && (!kw || (m.name + " " + m.email).toLowerCase().includes(kw)))
    .sort((a,b) => (on.includes(b.email) - on.includes(a.email)) || a.name.localeCompare(b.name, "ko"));
  $("#iCount").textContent = `${on.length}명 선택됨`;
  $("#iList").innerHTML = list.map(m => { const p = on.includes(m.email);
    return `<button class="ivrow" data-iv="${esc(m.email)}" aria-pressed="${p}"><span class="av">${esc(m.name.slice(0,1))}</span><span class="who">${esc(m.name)}<small>${esc(m.email)}</small></span><span class="st">${p?"✓ 초대됨":"초대"}</span></button>`;
  }).join("") || `<div class="empty-msg">검색 결과가 없습니다.</div>`;
}
$("#iSearch").addEventListener("input", renderIv);
$("#iSearch").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#iList [data-iv]")?.click(); } });
$("#iList").onclick = e => {
  const b = e.target.closest("[data-iv]"); if (!b) return;
  const em = b.dataset.iv, ivs = S.session.interviewers;
  S.session.interviewers = ivs.includes(em) ? ivs.filter(x => x !== em) : [...ivs, em];
  dirty = true; renderIv(); renderSessionBar(); renderCards();
};
$("#meetIn").oninput = e => { S.session.meet = e.target.value.trim(); dirty = true; };
$("#meetBtn").onclick = () => { const u = S.session.meet; if (!/^https:\/\/meet\.google\.com\//.test(u)) return toast("Meet 링크(https://meet.google.com/...)를 먼저 붙여넣으세요"); window.open(u, "meet", "width=960,height=720"); };
let delArmed = false;
$("#delSess").onclick = async () => {
  if (!delArmed) { delArmed = true; $("#delSess").textContent = "한 번 더 누르면 삭제"; setTimeout(() => { delArmed = false; $("#delSess").textContent = "세션 삭제"; }, 3000); return; }
  delArmed = false; $("#delSess").textContent = "세션 삭제";
  try { const r = await call("deleteSession", {id:cur}); cur = null; S = null; store.del("pe_last"); DB = r.boot; renderTree();
    $("#room").hidden = true; $("#sessTools").hidden = true; $("#blank").hidden = false; $("#crumb").textContent = "세션을 고르세요"; toast("세션을 삭제했습니다");
  } catch(e){ toast(e.message); }
};

/* ---------- 질문 카드 ---------- */
const tagOf = c => c.preset==="intro" ? `자기소개·${INTRO_LABEL[c.kind]||""}` : c.preset==="vision" ? "포부" : c.src || "";
function renderCards(){
  const multi = S.session.interviewers.length > 1;
  $("#cards").innerHTML = S.cards.map(c => {
    const run = active === c.id;
    const head = c.preset ? `<span class="tag preset">${c.preset==="intro"?"자기소개":"포부"}</span>` : c.src ? `<span class="tag gichul">${esc(c.src)}</span>` : "";
    const qBody = c.preset==="intro" && c.kind==="etc"
      ? `<input class="qedit" data-introetc value="${esc(c.q)}" placeholder="자기소개 방향을 입력하세요 (예: 지원 동기 중심으로)" aria-label="자기소개 질문">`
      : c.q && editing !== c.id ? `<span class="text" data-act="edit" title="눌러서 질문 수정">${esc(c.q)}</span>`
      : `<input class="qedit" data-qedit value="${esc(c.q||"")}" placeholder="질문을 입력하세요" aria-label="질문">`;
    const canEdit = c.q && editing !== c.id && !(c.preset==="intro" && c.kind==="etc");
    return `<article class="panel qcard ${run?"running":""}" data-id="${c.id}">
      <span class="grip" draggable="true" title="끌어서 순서 바꾸기" aria-label="순서 바꾸기">⋮⋮</span>
      <div class="q">${head}${qBody}</div>
      <div class="ctrl">
        <span class="time num" data-time>${fmt(c.t)}</span>
        <button class="ib play" data-act="toggle" aria-label="${run?"일시정지":"재생"}">${run?ICON.pause:ICON.play}</button>
        <button class="ib" data-act="reset" aria-label="초기화">${ICON.reset}</button>
        ${canEdit?`<button class="ib del" data-act="edit" aria-label="질문 수정" title="질문 수정">${ICON.edit}</button>`:""}
        <button class="ib del" data-act="del" aria-label="카드 삭제">${ICON.del}</button>
      </div>
      ${c.preset==="intro"?`<div class="kinds" role="group" aria-label="자기소개 유형">${Object.entries(INTRO_LABEL).map(([k,l]) => `<button data-kind="${k}" aria-pressed="${c.kind===k}">${l}</button>`).join("")}</div>`:""}
      <div class="tags">${(c.tags||[]).map(t => `<span class="chip">#${esc(t)}<button data-untag="${esc(t)}" aria-label="${esc(t)} 태그 빼기">×</button></span>`).join("")}<input data-tag list="tagList" placeholder="+ 태그" aria-label="태그 추가"></div>
      ${c.followups && c.followups.length ? `<ul class="fu">${c.followups.map(f => `<li>꼬리: ${esc(f)}</li>`).join("")}</ul>` : ""}
      <textarea rows="1" data-note placeholder="${multi?esc(DB.me.name)+" 기록":"기록"}" aria-label="기록">${esc(c.myNote)}</textarea>
      <div class="others" data-others>${othersHtml(c)}</div>
      ${c.ans?`<details><summary>모범답안 보기</summary><p>${esc(c.ans)}</p></details>`:""}
    </article>`;
  }).join("") || `<div class="panel empty-msg">아직 질문 카드가 없습니다. 기출문제 탐색이나 + 질문으로 추가하세요.</div>`;
  document.querySelectorAll("#cards textarea").forEach(grow);
  if (S.ro) document.querySelectorAll("#cards textarea, #cards input, #cards button").forEach(el => el.disabled = true);
  // 이 세션에서 쓴 태그를 자동완성 후보로
  const all = [...new Set(S.cards.flatMap(c => c.tags || []))].sort((a,b) => a.localeCompare(b, "ko"));
  $("#tagList").innerHTML = all.map(t => `<option value="${esc(t)}">`).join("");
  if (document.activeElement !== $("#overall")) { $("#overall").value = S.session.overall || ""; grow($("#overall")); }
  updateTotal();
}
const othersHtml = c => Object.entries(c.notes || {}).filter(([e,v]) => e !== DB.me.email && v).map(([e,v]) => `<span><b>${esc(nameOf(e))}</b> ${esc(v)}</span>`).join("");
// 총 시간 = 첫 질문을 시작한 때부터 [면접 종료]를 누를 때까지. 질문 타이머를 멈춰도 계속 흐른다.
const inProgress = () => !!(S && S.session.startedAt && !S.session.endedAt);
const total = () => {
  const st = S.session.startedAt; if (!st) return 0;
  const end = S.session.endedAt ? Date.parse(S.session.endedAt) : Date.now();
  return Math.max(0, Math.round((end - Date.parse(st)) / 1000));
};
// 질문을 시작하면 총 시간이 시작된다 (종료 뒤 다시 시작하면 이어서 흐른다). 모든 카드 시간을 초기화하면 총 시간도 비운다.
function markClock(){
  if (active && !S.session.startedAt) S.session.startedAt = new Date().toISOString();
  if (active && S.session.endedAt) S.session.endedAt = "";
  if (!active && S.cards.every(c => !c.t)) { S.session.startedAt = ""; S.session.endedAt = ""; }
  dirty = true;
}
function updateTotal(){
  $("#total").textContent = fmt(total());
  $("#endBtn").hidden = !inProgress() || S.ro;
  $("#meta").textContent = `질문 ${S.cards.length}개 · 답변 ${S.cards.filter(c => c.t > 0).length}개`;
}
const findCard = el => S.cards.find(x => x.id === el.closest("[data-id]")?.dataset.id);
$("#cards").addEventListener("click", e => {
  if (S.ro) return;
  const k = e.target.closest("[data-kind]");
  if (k) { const c = findCard(k); c.kind = k.dataset.kind; c.q = INTRO[c.kind] || ""; dirty = true; renderCards();
    if (c.kind === "etc") document.querySelector(`[data-id="${c.id}"] [data-introetc]`)?.focus(); return; }
  const ut = e.target.closest("[data-untag]");
  if (ut) { const c = findCard(ut); c.tags = c.tags.filter(t => t !== ut.dataset.untag); dirty = true; renderCards(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const c = findCard(b);
  if (b.dataset.act === "toggle") active = active === c.id ? null : c.id;
  if (b.dataset.act === "reset") { c.t = 0; if (active === c.id) active = null; dirty = true; }
  if (b.dataset.act === "edit") { editing = c.id; renderCards(); const i = document.querySelector(`[data-id="${c.id}"] [data-qedit]`); i?.focus(); i?.select(); return; }
  if (b.dataset.act === "del") {
    const used = c.t > 0 || c.myNote || Object.values(c.notes || {}).some(Boolean);
    if (used && !confirm("이 카드에는 측정 시간이나 기록이 있습니다. 카드를 삭제할까요?")) return;
    S.cards = S.cards.filter(x => x !== c); if (active === c.id) active = null; if (editing === c.id) editing = null; dirty = true; }
  if (["toggle","reset","del"].includes(b.dataset.act)) markClock();
  renderCards(); updateTotal();
});
$("#cards").addEventListener("input", e => {
  const el = e.target, c = findCard(el); if (!c) return;
  if (el.matches("[data-note]")) { c.myNote = el.value; grow(el); dirty = true; }
  if (el.matches("[data-introetc]")) { c.q = el.value.trim(); dirty = true; }
});
$("#cards").addEventListener("change", e => {
  if (!e.target.matches("[data-qedit]")) return;
  const c = findCard(e.target), v = e.target.value.trim();
  if (v) c.q = v;             // 비우면 원래 질문 유지 (지우려면 X)
  editing = null; dirty = true; renderCards();
});
// 태그: Enter·쉼표·스페이스로 넣고, 빈 칸에서 Backspace면 마지막 태그를 뺀다
const addTags = (c, raw) => {
  const ts = raw.split(/[,\s]+/).map(t => t.replace(/^#+/, "").trim().slice(0, 30)).filter(Boolean);
  c.tags = [...new Set([...(c.tags || []), ...ts])].slice(0, 10); if (ts.length) dirty = true;
};
$("#cards").addEventListener("keydown", e => {
  if (!e.target.matches("[data-tag]")) return;
  const el = e.target, c = findCard(el);
  if ((e.key === "Enter" || e.key === "," || e.key === " ") && !e.isComposing) {
    e.preventDefault(); if (!el.value.trim()) return;
    addTags(c, el.value); renderCards(); document.querySelector(`[data-id="${c.id}"] [data-tag]`)?.focus();
  } else if (e.key === "Backspace" && !el.value && c.tags?.length) { c.tags.pop(); dirty = true; renderCards(); document.querySelector(`[data-id="${c.id}"] [data-tag]`)?.focus(); }
});
$("#cards").addEventListener("focusout", e => {
  if (!e.target.matches("[data-tag]") || !e.target.value.trim()) return;
  const c = findCard(e.target); addTags(c, e.target.value); setTimeout(renderCards);
});
$("#cards").addEventListener("keydown", e => {
  if (!e.target.matches("[data-qedit]")) return;
  if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
  if (e.key === "Escape" && editing) { editing = null; renderCards(); }
});
$("#endBtn").onclick = () => {
  if (!inProgress()) return;
  active = null; S.session.endedAt = new Date().toISOString(); dirty = true;
  renderCards(); updateTotal(); flush(); toast(`면접을 종료했습니다 · 총 ${fmt(total())}`);
};
$("#overall").oninput = e => { S.session.overall = e.target.value; grow(e.target); dirty = true; };
// 새 카드는 포부 카드 앞에 넣어 포부가 계속 마지막에 오게 한다
const addCard = c => { const v = S.cards.findIndex(x => x.preset === "vision"); v < 0 ? S.cards.push(c) : S.cards.splice(v, 0, c); dirty = true; return c; };
$("#addBtn").onclick = () => { const c = addCard({id:rid(), q:"", t:0, notes:{}, myNote:""}); renderCards(); document.querySelector(`[data-id="${c.id}"] [data-qedit]`)?.focus(); };

/* 끌어서 순서 바꾸기 */
let dragEl = null;
$("#cards").addEventListener("dragstart", e => {
  if (!e.target.classList?.contains("grip")) return;
  dragEl = e.target.closest("article"); dragEl.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragEl.dataset.id); e.dataTransfer.setDragImage(dragEl, 20, 20);
});
$("#cards").addEventListener("dragover", e => {
  if (!dragEl) return; e.preventDefault();
  const over = e.target.closest("article"); if (!over || over === dragEl) return;
  const r = over.getBoundingClientRect();
  over.parentNode.insertBefore(dragEl, e.clientY < r.top + r.height/2 ? over : over.nextSibling);
});
$("#cards").addEventListener("drop", e => { if (dragEl) e.preventDefault(); });
$("#cards").addEventListener("dragend", () => {
  if (!dragEl) return; dragEl.classList.remove("dragging"); dragEl = null;
  const order = [...document.querySelectorAll("#cards article")].map(a => a.dataset.id);
  S.cards.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id)); dirty = true;
});

/* 타이머: 한 번에 한 카드만 */
setInterval(() => {
  if (inProgress() && active === null) updateTotal();
  if (active === null || !S) return;
  const c = S.cards.find(x => x.id === active); if (!c) { active = null; return; }
  c.t++; dirty = true;
  const el = document.querySelector(`[data-id="${c.id}"] [data-time]`); if (el) el.textContent = fmt(c.t);
  updateTotal();
}, 1000);

/* ---------- 자동 저장 ---------- */
async function flush(){
  if (saving) return;
  if (memoDirty && cand()) { memoDirty = false; call("saveCand", {cand:{id:cand().id, memo:cand().memo}}, {quiet:true}).catch(() => { memoDirty = true; }); }
  if (S && S.ro) dirty = false;
  if (!dirty || !S) return;
  saving = true; dirty = false; setSave("저장 중...");
  const sid = S.session.id;
  try {
    const r = await call("saveSession", {

function renderReport(){
  const s = S.session, c = cand();
  const ivs = s.interviewers;
  const notesOf = x => Object.assign({}, x.notes, x.myNote ? {[DB.me.email]: x.myNote} : {});
  const rv = curVer(), img = rv && imgCache[rv.path];
  const left = img ? `<div class="imgcap"><img src="${img}" alt=""></div>` : `<div class="box" style="color:#5B6675">이력카드 사진 없음</div>`;
  const items = S.cards.filter(x => x.q).map(x => {
    const n = notesOf(x);
    const notes = Object.keys(n).filter(k => n[k]).map(k => `${ivs.length>1?`<b>${esc(nameOf(k))}</b> `:""}${esc(n[k])}`).join("\n") || "-";
    return `<div class="fbi"><div class="h"><span>${tagOf(x)?`<span class="src">[${esc(tagOf(x))}]</span> `:""}${esc(x.q)}${(x.tags||[]).length?` <span class="src">${x.tags.map(t => "#"+esc(t)).join(" ")}</span>`:""}</span><span class="num">${x.t?fmt(x.t):"-"}</span></div><div class="n">${notes}</div></div>`;
  });
  // 1쪽: 좌 이력카드 / 우 결과·총평 + 피드백. 우측 단이 차면 다음 쪽 좌→우 단으로 흘려 넣는다 (실제 높이를 재서 판단)
  const box = $("#pages");
  box.innerHTML = `<div class="page-wrap"><div class="page"><div class="col"><h3>이력카드</h3>${left}</div>
    <div class="col"><h3>모의면접 결과 · ${esc(c.name)}</h3>
      <div class="meta">${s.date} · ${esc(c.field)}${c.round?` ${esc(c.round)}회`:""} · 면접위원 ${ivs.map(e => esc(nameOf(e))).join(", ")}</div>
      <div class="kpi"><div>총 시간<b>${fmt(total())}</b></div><div>질문<b>${S.cards.length}개</b></div></div>
      <h3>총평</h3><div class="box">${esc(s.overall || "(총평 미입력)")}</div>
      ${items.length?`<h3>질문별 피드백</h3>`:""}
    </div><span class="pg"></span></div></div>`;
  const cols = [box.querySelectorAll(".page .col")[1]];
  const newPage = () => {
    box.insertAdjacentHTML("beforeend", `<div class="page-wrap"><div class="page"><div class="col"></div><div class="col"></div><span class="pg"></span></div></div>`);
    cols.push(...box.lastElementChild.querySelectorAll(".col"));
  };
  let ci = 0;
  items.forEach(h => {
    for (;;) {
      const col = cols[ci];
      col.insertAdjacentHTML("beforeend", h);
      if (col.scrollHeight <= col.clientHeight + 1 || col.children.length === 1) break;
      col.lastElementChild.remove(); ci++;
      if (ci >= cols.length) newPage();
    }
  });
  const pgs = box.querySelectorAll(".pg");
  pgs.forEach((p,i) => p.textContent = `${i+1} / ${pgs.length}`);
}

}

      if (f === "email" && v && !EMAIL_RE.test(v)) { toast("이메일 형식이 아닙니다"); return renderAcl(); }
      await saveCandPatch(c, {[f]:v}); toast("저장했습니다"); return;
    }
    if (AD.tab === "acl" && t.matches("[data-inv]")) return addInv(t);
    if (AD.tab === "bulk" && t.dataset.pick !== undefined) { AD.pick[t.dataset.pick] = t.value; AD.rows = parseBulk(); return renderBulk(); }
    if (t.id === "gRev") { AD.gRev = t.checked; return renderGichul(); }
  } catch(err){ toast(err.message); }
});

/* 열람 권한: 응시자 내용을 볼 수 있는 사람 = 등록자 · 초대 · 그 응시자 세션의 면접위원 · 응시자 이메일 본인 · 관리자 */
async function saveCandPatch(c, patch){
  const done = must(await sb.from("pe_candidates").update(patch).eq("id", c.id).select("id"));
  if (!done.length) throw new Error("저장하지 못했습니다 (권한 확인)");
  Object.assign(c, patch);
  await refreshDB(); renderAcl();
}
// 초대 칸: 이메일이나 동기 이름. 동기 목록에 있는 사람만 넣는다 (없는 사람은 동기 관리에서 먼저 추가)
async function addInv(input){
  const raw = input.value.trim(); if (!raw) return;
  const c = DB.cands.find(x => x.id === input.closest("[data-cid]").dataset.cid);
  const hits = raw.includes("@") ? DB.members.filter(m => m.email === raw.toLowerCase()) : DB.members.filter(m => m.name === raw);
  if (!hits.length) return toast(`동기 목록에 없습니다: ${raw}. 동기 관리 탭에서 먼저 추가하세요`);
  if (hits.length > 1) return toast(`같은 이름이 ${hits.length}명입니다. 이메일로 입력하세요`);
  const em = hits[0].email;
  if (c.invited.includes(em)) { input.value = ""; return toast("이미 초대되어 있습니다"); }
  await saveCandPatch(c, {invited:[...c.invited, em]});
  toast(`${hits[0].name} 님을 ${c.name}에 초대했습니다`);
  document.querySelector(`[data-cid="${CSS.escape(c.id)}"] [data-inv]`)?.focus();
}

/* 일괄 등록: 엑셀에서 [응시자 | 날짜 | 시각 | 면접위원] 열을 복사해 붙여넣는다. 면접위원은 여러 명이면 쉼표로. */
function parseDate(s){
  const n = String(s || "").match(/\d+/g); if (!n || n.length < 2) return "";
  let y, m, d;
  if (n[0].length === 4 && n.length >= 3) [y, m, d] = n; else if (n[0].length <= 2) { y = String(new Date().getFullYear()); [m, d] = n; } else return "";
  m = +m; d = +d; if (m < 1 || m > 12 || d < 1 || d > 31) return "";
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
const TIME_RE = /^(\d{1,2}):(\d{2})(:\d{2})?$/;
function parseBulk(){
  const grp = AD.bulk.grp.trim(), seen = new Set(), out = [];
  AD.bulk.text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const cells = line.includes("\t") ? line.split("\t").map(s => s.trim()) : line.trim().split(/\s+/);
    const r = {no:i + 1, name:cells[0] || "", date:parseDate(cells[1]), time:"", ivs:[], plan:[], notes:[], amb:[]};
    let k = 2; const tm = TIME_RE.exec(cells[2] || "");
    if (tm) { r.time = `${tm[1].padStart(2, "0")}:${tm[2]}`; k = 3; }
    if (!r.date && /날짜|일자|이름|응시자/.test(line)) return;     // 머리글 줄
    if (!r.name) r.err = "응시자 이름 없음";
    else if (!r.date) r.err = `날짜를 못 읽음: ${cells[1] || "(빈칸)"}`;
    cells.slice(k).join(",").split(/[,;/·]+/).map(s => s.trim()).filter(Boolean).forEach(tok => {
      if (tok.includes("@")) {
        const em = tok.toLowerCase();
        if (DB.members.some(m => m.email === em)) r.ivs.push(em); else r.err = r.err || `동기 목록에 없는 이메일: ${tok}`;
        return;
      }
      const hits = DB.members.filter(m => m.name === tok);
      if (hits.length === 1) r.ivs.push(hits[0].email);
      else if (hits.length > 1) { if (AD.pick[tok]) r.ivs.push(AD.pick[tok]); else { r.amb.push(tok); r.err = r.err || `${tok}: 같은 이름 계정이 ${hits.length}개, 위에서 고르세요`; } }
      else r.plan.push(tok);
    });
    r.ivs = [...new Set(r.ivs)];
    if (r.plan.length) r.notes.push(`미가입 배정: ${r.plan.join(", ")}`);
    if (r.plan.length > 1) r.notes.push("미가입이 2명 이상이면 나중에 연결 버튼이 안 맞습니다");
    const c = DB.cands.find(x => x.name === r.name && (x.grp || "") === grp);
    r.isNew = !c;
    const key = r.name + "|" + r.date + "|" + r.time;
    if (!r.err && ((c && DB.sessions.some(s => s.candId === c.id && String(s.date) === r.date && (s.time || "") === r.time)) || seen.has(key))) r.skip = true;
    seen.add(key);
    out.push(r);
  });
  return out;
}

    <div class="arow"><button class="btn" data-a="bulkPreview">미리보기</button><button class="btn primary" id="bkRun" data-a="bulkRun" ${rows && nNew && !nErr ? "" : "disabled"}>등록</button>
      <span class="muted" style="font-size:12px">${rows ? `${rows.length}줄 · 새 세션 ${nNew}개 · 새 응시자 ${nCand}명${nErr ? ` · <span class="st-err">오류 ${nErr}줄</span>` : ""}` : "미리보기로 먼저 확인하세요"}</span></div>
    ${amb.length ? `<div class="arow">${amb.map(n => `<label style="font-size:13px">${esc(n)} → <select data-pick="${esc(n)}"><option value="">계정 선택</option>${DB.members.filter(m => m.name === n).map(m => `<option value="${esc(m.email)}" ${AD.pick[n] === m.email ? "selected" : ""}>${esc(m.email)}</option>`).join("")}</select></label>`).join("")}</div>` : ""}
  </div>
  <div id="bkPrev">${rows && rows.length ? `<div class="panel tblw"><table class="at"><thead><tr><th>줄</th><th>응시자</th><th>일시</th><th>면접위원</th><th>상태</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="num">${r.no}</td><td>${esc(r.name)}${r.isNew && !r.err ? ` <span class="st-new" style="font-size:11px">새 응시자</span>` : ""}</td><td class="num">${esc(r.date)} ${esc(r.time)}</td>
      <td>${r.ivs.map(e => esc(nameOf(e))).join(", ")}${r.plan.length ? `${r.ivs.length ? ", " : ""}<span class="muted">${r.plan.map(esc).join(", ")} (미가입)</span>` : ""}</td>
      <td>${r.err ? `<span class="st-err">${esc(r.err)}</span>` : r.skip ? `<span class="st-skip">이미 있음 · 건너뜀</span>` : `<span class="st-new">등록</span>`}${r.notes.length && !r.err ? `<br><small class="st-warn">${esc(r.notes.join(" · "))}</small>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : rows ? `<div class="panel empty-msg">읽을 줄이 없습니다</div>` : ""}</div>`;

        <label>질문</label><textarea data-g="q" rows="2">${esc(g.q)}</textarea>
        <label>꼬리질문</label><textarea data-g="followups" rows="3" placeholder="한 줄에 하나">${esc(g.followups.join("\n"))}</textarea>
        <label>모범답안</label><textarea data-g="answer" rows="8">${esc(g.answer)}</textarea>
        <div class="arow"><span class="muted" style="font-size:11.5px">${esc(g.id)}</span>
          <button class="btn sm ghost push" data-a="gdel" style="color:var(--over)">삭제</button>
          <button class="btn sm" data-a="gsave">저장</button>${g.needsReview ? `<button class="btn sm primary" data-a="gdone">검토 완료</button>` : ""}</div>
      </div></details>`).join("") || `<div class="empty-msg">${AD.gRev ? "검토 필요한 기출이 없습니다" : "조건에 맞는 기출이 없습니다"}</div>`}</div>`;
}
// review: null이면 검토 상태 유지, false면 검토 완료 처리
async function saveGichul(box, review){
  const id = box.dataset.gid, g = AD.gichul.find(x => x.id === id), v = k => box.querySelector(`[data-g="${k}"]`).value;
  const round = parseInt(v("round"), 10), q = v("q").trim();
  if (!q) throw new Error("질문을 비울 수 없습니다");
  if (!round) throw new Error("회차는 숫자로 입력하세요");
  const patch = {round, type:v("type"), domain:v("domain").trim(), q, answer:v("answer").trim(),
    followups:v("followups").split(/\r?\n/).map(s => s.trim()).filter(Boolean)};
  if (review === false) patch.needs_review = false;
  const done = must(await sb.from("pe_gichul").update(patch).eq("id", id).select("id"));
  if (!done.length) throw new Error("저장하지 못했습니다 (권한 확인)");
  Object.assign(g, patch, review === false ? {needsReview:false} : {});
  GICHUL = null;
  if (review === false) AD.gOpen.delete(id);
  renderGichul(); toast(review === false ? "검토 완료로 표시했습니다" : "저장했습니다");
}
boot();
</script>
